<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publicacion de libros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/styles/output.css" />
</head>
<body class="min-h-screen bg-[#F9FAFB] font-sans text-slate-900 antialiased">
  <div id="root"></div>

  <script type="module">
    import React from "https://esm.sh/react@18.3.1";
    import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
    import { Calendar, BookOpen, BarChart3, Bell, Search } from "https://esm.sh/lucide-react@0.468.0?deps=react@18.3.1";

    // Cada opción mantiene su icono Lucide y una etiqueta clara.
    const menuItems = [
      { label: "Iniciar sesión", icon: Calendar },
      { label: "Libros", icon: BookOpen },
      { label: "Escribir libros", icon: BarChart3 },
      { label: "Categoría", icon: Bell },
      { label: "Buscar", icon: Search },
    ];

    // Libreta hecha con divs y lineas internas CSS.
    function NotebookIllustration() {
      return (
        React.createElement("div", { className: "relative" },
          React.createElement("div", { className: "absolute inset-5 rotate-[-8deg] rounded-2xl bg-blue-100/70" }),
          React.createElement("div", {
          className: "relative h-[250px] w-[190px] rotate-[-15deg] overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-[0_24px_50px_-18px_rgba(15,23,42,0.35)] sm:h-[330px] sm:w-[250px] lg:h-[380px] lg:w-[285px]",
          "aria-label": "Ilustracion de libreta inclinada",
        },
          React.createElement("div", { className: "absolute inset-x-0 top-0 h-11 bg-slate-900" }),
          React.createElement("span", { className: "absolute right-5 top-3 text-[8px] font-semibold uppercase tracking-[0.2em] text-blue-200 sm:text-[10px]" }, "Manuscrito"),
          React.createElement("div", { className: "absolute left-7 top-11 h-[calc(100%-2.75rem)] w-px bg-blue-100" }),
          React.createElement("div", { className: "absolute inset-x-5 top-[4.25rem] space-y-5 sm:space-y-6" },
            Array.from({ length: 10 }).map((_, index) =>
              React.createElement("span", {
                key: index,
                className: "block h-px w-full rounded-full bg-slate-200",
              })
            )
          ),
          React.createElement("div", { className: "absolute -left-2 top-[4.5rem] flex h-[68%] flex-col justify-between" },
            Array.from({ length: 7 }).map((_, index) =>
              React.createElement("span", {
                key: index,
                className: "h-3 w-3 rounded-full border border-gray-200 bg-[#F9FAFB] shadow-sm",
              })
            )
          ))
        )
      );
    }

    function MenuButton({ item }) {
      const Icon = item.icon;

      return (
        React.createElement("button", {
          className: "group flex h-14 w-full items-center gap-4 rounded-2xl border border-[#E5E7EB] bg-white px-4 text-left text-sm font-semibold text-slate-700 shadow-sm transition duration-200 hover:-translate-y-0.5 hover:border-[#3B82F6] hover:bg-[#3B82F6] hover:text-white hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-blue-100 sm:w-64",
          type: "button",
        },
          React.createElement("span", { className: "grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-blue-50 text-blue-600 transition group-hover:bg-white/20 group-hover:text-white" },
            React.createElement(Icon, { className: "h-4 w-4", "aria-hidden": "true" })
          ),
          React.createElement("span", { className: "truncate" }, item.label)
        )
      );
    }

    function App() {
      return (
        React.createElement("main", { className: "relative min-h-screen overflow-hidden bg-[#F9FAFB] px-6 py-8 sm:px-10 lg:px-16" },
          React.createElement("div", { className: "pointer-events-none absolute -left-32 top-1/3 h-72 w-72 rounded-full bg-blue-100/50 blur-3xl" }),
          React.createElement("div", { className: "pointer-events-none absolute -right-20 -top-20 h-80 w-80 rounded-full bg-sky-100/50 blur-3xl" }),
          React.createElement("section", {
            className: "relative mx-auto grid min-h-[calc(100vh-4rem)] max-w-6xl grid-cols-1 items-center gap-12 lg:grid-cols-[280px_1fr] lg:gap-20 lg:pr-16",
          },
            // En escritorio el menú queda centrado verticalmente a la izquierda.
            React.createElement("aside", { className: "order-2 mx-auto w-full max-w-xs rounded-[1.5rem] border border-white/80 bg-white/75 p-4 shadow-[0_20px_50px_-35px_rgba(15,23,42,0.45)] backdrop-blur sm:max-w-sm lg:order-1 lg:mx-0 lg:max-w-none lg:self-center" },
              React.createElement("div", { className: "mb-4 px-2" },
                React.createElement("p", { className: "text-xs font-bold uppercase tracking-[0.18em] text-blue-600" }, "Espacio de autor"),
                React.createElement("p", { className: "mt-1 text-sm text-slate-500" }, "Gestiona tus publicaciones")
              ),
              React.createElement("div", { className: "flex flex-col gap-3" },
                menuItems.map((item) => React.createElement(MenuButton, { key: item.label, item }))
              )
            ),
            React.createElement("div", { className: "order-1 flex min-h-[420px] flex-col items-center justify-center gap-9 lg:order-2 lg:min-h-[620px] lg:justify-center" },
              React.createElement("div", { className: "max-w-xl text-center" },
                React.createElement("p", { className: "mb-3 text-xs font-bold uppercase tracking-[0.22em] text-blue-600" }, "Tu proximo capitulo comienza aqui"),
                React.createElement("h1", { className: "text-4xl font-bold tracking-tight text-slate-900 sm:text-5xl" }, "Publicacion de libros"),
                React.createElement("p", { className: "mx-auto mt-4 max-w-md text-sm leading-6 text-slate-500 sm:text-base" }, "Organiza, escribe y da vida a cada historia desde un solo lugar.")
              ),
              React.createElement(NotebookIllustration)
            ),
            // Banner lateral fijo para desktop.
            React.createElement("div", { className: "pointer-events-none fixed right-0 top-1/2 z-10 hidden -translate-y-1/2 lg:block" },
              React.createElement("div", { className: "rounded-l-2xl bg-slate-900 px-4 py-7 shadow-xl" },
                React.createElement("p", { className: "[writing-mode:vertical-rl] rotate-180 text-xs font-bold uppercase tracking-[0.18em] text-white" }, "Publicacion de libros")
              )
            ),
            React.createElement("div", { className: "order-3 flex justify-center lg:hidden" },
              React.createElement("div", { className: "rounded-2xl bg-slate-900 px-6 py-3 text-sm font-bold text-white shadow-lg" }, "Publicacion de libros")
            )
          )
        )
      );
    }

    createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
