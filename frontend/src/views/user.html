<section>
<h2 id="formTitle">Nuevo usuario</h2>
<form id="userForm">
    <input type="hidden" name="id">
    <label>Usuario <input name="username" required maxlength="50"></label>
    <label>Email <input type="email" name="email" required maxlength="100"></label>
    <label>Contraseña <input type="password" name="password" minlength="6"></label>
    <label>Rol
        <select name="rol">
            <option value="Lector">Lector</option>
            <option value="Personal">Personal</option>
            <option value="Administrador">Administrador</option>
        </select>
    </label>
    <label>Activo <input type="checkbox" name="activo" value="1" checked></label>
    <button type="submit">Guardar</button>
    <button type="button" id="cancelUser">Cancelar</button>
</form>
<p id="userMessage" role="alert"></p>
<h2>Listado de usuarios</h2>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody id="userTableList">
    </tbody>
</table>
</section>
